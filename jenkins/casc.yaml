# Jenkins Configuration as Code: the whole controller is reproducible from this file.
jenkins:
  systemMessage: "SportPredict CI/CD - configured as code (jenkins/casc.yaml)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true
  globalNodeProperties:
    - envVars:
        env:
          - key: KIND_CLUSTER
            value: "${KIND_CLUSTER:-}"
          - key: DOCKERHUB_REPO
            value: "${DOCKERHUB_REPO:-}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: kind-kubeconfig
              description: "kubeconfig of the local kind cluster (internal address)"
              fileName: kubeconfig
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      multibranchPipelineJob('sportpredict-core') {
        displayName('SportPredict Core')
        description('Lint, unit tests, Docker image and deployment for every commit of every branch.')
        branchSources {
          branchSource {
            source {
              git {
                id('sportpredict-core')
                remote('https://github.com/Safyd-Zey/sportpredict-core.git')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        triggers {
          periodicFolderTrigger { interval('1m') }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(5) }
        }
      }
